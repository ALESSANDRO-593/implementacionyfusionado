@if (isLoginRoute()) {
  <router-outlet />
} @else {
<div class="admin-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard" aria-label="Ir al panel general">
      <span class="brand__mark">P</span>
      <span class="brand__copy"><strong>Administración</strong><small>del Parqueadero</small></span>
    </a>

    <div class="nav-heading">Panel administrativo</div>
    <nav aria-label="Navegación principal">
      <a routerLink="/dashboard" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1" /><rect x="14" y="4" width="6" height="6" rx="1" /><rect x="4" y="14" width="6" height="6" rx="1" /><rect x="14" y="14" width="6" height="6" rx="1" /></svg>
        <span>Panel general</span>
      </a>
      <a routerLink="/usuarios" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3" /><path d="M3.5 19c.5-3.2 2.4-5 5.5-5s5 1.8 5.5 5M15 6.5a3 3 0 0 1 0 5.8M16 14c2.5.4 4 2 4.5 4.5" /></svg>
        <span>Usuarios</span>
      </a>
      <a routerLink="/vehiculos" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 16 1.5-6h11l2 6M3 16h18v3H3zM7 19v2m10-2v2" /><circle cx="8" cy="16" r="1" /><circle cx="17" cy="16" r="1" /></svg>
        <span>Vehículos</span>
      </a>
      <a routerLink="/tickets" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2" /><path d="M3 10h18" /></svg>
        <span>Gestión de tickets</span>
      </a>
      <a class="nav-item" routerLink="/configuracion" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z" /></svg>
        <span>Configuración</span>
      </a>
    </nav>

    <div class="sidebar__footer">
      <small>{{ sessionUser()?.role ?? 'Perfil de acceso' }}</small>
      <button type="button" title="Cerrar sesión" (click)="logout()">
        <span>{{ sessionUser()?.fullName ?? 'Administrador' }}</span><span>Salir</span>
      </button>
    </div>
  </aside>

  <main class="main-content"><router-outlet /></main>
</div>
}
