name: Reportar un error
description: Registrar un problema encontrado en YaviBot o parqueadero
title: "[BUG] "
labels:
  - bug
body:
  - type: dropdown
    id: modulo
    attributes:
      label: Módulo afectado
      options:
        - Mesa de ayuda
        - Aplicación de matrícula
        - Administración de parqueadero
        - Workflows n8n
        - Base de datos
        - Infraestructura y despliegue
    validations:
      required: true

  - type: textarea
    id: descripcion
    attributes:
      label: Descripción del problema
      description: Explica claramente qué está ocurriendo.
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ingresar a...
        2. Presionar...
        3. Observar...
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia adicional
      description: Adjunta capturas, logs o mensajes de error sin incluir credenciales.

  - type: checkboxes
    id: seguridad
    attributes:
      label: Verificación de seguridad
      options:
        - label: Confirmo que no incluí contraseñas, tokens ni claves privadas.
          required: true
